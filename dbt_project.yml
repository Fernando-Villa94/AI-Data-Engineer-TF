name: 'adventureworks_pipeline'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# =====================================================================
# CONFIGURACIÓN DE MODELOS (Aquí controlamos la materialización)
# =====================================================================
models:
  adventureworks_pipeline:
    # Todo lo que guardes dentro de la carpeta models/staging/ se creará como VISTA
    staging:
      +materialized: view
      +schema: catalog_staging